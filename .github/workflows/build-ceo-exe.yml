name: Build CEO Monitor EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'ceo_monitor.py'
      - '.github/workflows/build-ceo-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Standalone EXE
        run: pyinstaller --noconfirm --onefile --windowed --name "KiwoomENC_CEO_Monitor" ceo_monitor.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CEO-Monitor-EXE
          path: dist/KiwoomENC_CEO_Monitor.exe
