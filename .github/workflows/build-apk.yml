name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk gyecheuk-input.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gyecheuk-input-apk
          path: gyecheuk-input.apk

      - name: Publish to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 현장 계측 입력 안드로이드 앱 (최신 APK)
          body: |
            휴대폰에서 아래 `gyecheuk-input.apk`를 눌러 바로 설치하세요.
            - 사진 촬영 시 휴대폰 갤러리의 `Pictures/계측사진/<현장명>/` 폴더에 자동으로 분류 저장됩니다.
            - 구글 드라이브 로그인 없이 접속 코드만으로 바로 작동합니다.
          files: gyecheuk-input.apk
          prerelease: false
