name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Firebase 설정 파일 만들기 (푸시 알림용, 저장소에는 올리지 않고 비밀값에서 만든다)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "비밀값 GOOGLE_SERVICES_JSON이 없습니다"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: 서명 키 꺼내기 (모든 빌드를 같은 키로 서명해야 폰에서 덮어 설치가 된다)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "비밀값 KEYSTORE_BASE64가 없습니다"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APKs (직원용 + 대표님 감독판)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleStaffRelease --no-daemon   # 감독판(ceo)은 푸시 설정이 없어 당분간 빌드하지 않는다

      - name: Rename APKs
        run: |
          cp android/app/build/outputs/apk/staff/release/app-staff-release.apk gyecheuk-input.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gyecheuk-input-apk
          path: gyecheuk-input.apk

      - name: Publish to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 현장 계측 입력 안드로이드 앱 (최신 APK)
          body: |
            휴대폰에서 아래 `gyecheuk-input.apk`를 눌러 바로 설치하세요.
            - 사진 촬영 시 휴대폰 갤러리의 `Pictures/계측사진/<현장명>/` 폴더에 자동으로 분류 저장됩니다.
            - 구글 드라이브 로그인 없이 접속 코드만으로 바로 작동합니다.

            대표님용 감독판은 `kiwoom-ceo.apk`를 설치하세요. (직원용 앱과 따로 설치되며, 읽기 전용입니다.)
          files: gyecheuk-input.apk
          prerelease: false
