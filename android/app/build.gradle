plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'   // app/google-services.json(Firebase 설정)을 읽는다. 저장소에는 올리지 않고 CI가 비밀값에서 만든다
}

android {
    namespace 'com.kiwoomenc.gyecheuk'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kiwoomenc.gyecheuk'
        minSdk 26
        targetSdk 34
        versionCode 26
        versionName '1.26'
    }

    buildFeatures {
        buildConfig true
    }

    // 같은 소스에서 직원용(staff)과 대표님 감독판(ceo) APK를 따로 만든다. 감독판은 앱 ID가 달라 직원용과 함께 설치할 수 있다.
    flavorDimensions 'role'
    productFlavors {
        staff {
            dimension 'role'
            resValue 'string', 'app_name', '키움이엔씨'
            buildConfigField 'String', 'LIVE_URL', '"https://tkhs9775-gif.github.io/gyecheuk-input/"'
            buildConfigField 'String', 'LOCAL_URL', '"file:///android_asset/www/index.html"'
        }
        ceo {
            dimension 'role'
            applicationIdSuffix '.ceo'
            versionCode 1
            versionName '1.0-ceo'
            resValue 'string', 'app_name', '키움 감독판'
            buildConfigField 'String', 'LIVE_URL', '"https://tkhs9775-gif.github.io/gyecheuk-input/ceo.html"'
            buildConfigField 'String', 'LOCAL_URL', '"file:///android_asset/www/ceo.html"'
        }
    }

    // 모든 빌드를 같은 키로 서명해야 직원 폰에서 덮어 설치(업데이트)가 된다. 키 파일과 비밀번호는 저장소에 없고 CI가 비밀값에서 꺼내 준다.
    // KEYSTORE_FILE이 없는 내 컴퓨터 빌드는 예전처럼 debug 키를 쓴다(이 APK는 직원에게 배포하지 말 것).
    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'kiwoom'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

// 빌드 시 루트 폴더의 최신 웹앱 파일들을 assets/www 로 자동 복사
tasks.register('syncWebAssets', Copy) {
    from('../../') {
        include '*.html', '*.css', '*.js', '*.png', '*.json'
    }
    into 'src/main/assets/www'
}

preBuild.dependsOn syncWebAssets
