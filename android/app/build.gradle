plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kiwoomenc.gyecheuk'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kiwoomenc.gyecheuk'
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName '1.19'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

// 빌드 시 루트 폴더의 최신 웹앱 파일들을 assets/www 로 자동 복사
tasks.register('syncWebAssets', Copy) {
    from('../../') {
        include '*.html', '*.css', '*.js', '*.png', '*.json'
    }
    into 'src/main/assets/www'
}

preBuild.dependsOn syncWebAssets
