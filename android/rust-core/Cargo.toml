[package]
name = "gyecheuk-android-core"
version = "0.2.0"
edition = "2021"
description = "JNI & WebAssembly Rust core library for gyecheuk-cloud"

[lib]
name = "gyecheuk_core"
crate-type = ["cdylib", "rlib"]

# ai = Claude 창구 검사(ai.rs·json.rs). Code.gs 는 잠금·복귀만 써서 --no-default-features 작은 판을 넣는다(embed-wasm.js)
[features]
default = ["ai"]
ai = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
