[package]
name = "gyecheuk-android-core"
version = "0.1.0"
edition = "2021"
description = "JNI Rust core library for gyecheuk-cloud Android app"

[lib]
name = "gyecheuk_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
