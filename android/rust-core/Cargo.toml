[package]
name = "gyecheuk-android-core"
version = "0.2.0"
edition = "2021"
description = "JNI & WebAssembly Rust core library for gyecheuk-cloud"

[lib]
name = "gyecheuk_core"
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
