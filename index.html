<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="계측 입력">
<link rel="icon" href="data:,">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="style.css?v=9">
<title>계측 입력</title>
</head>
<body>

<div id="splash" role="status" aria-live="polite">
  <div class="logo-wrap">
    <img class="splash-logo" src="logo.png" alt="(주)키움이엔씨">
    <span class="sheen" aria-hidden="true"><i></i></span>
  </div>
  <span class="splash-rule" aria-hidden="true"></span>
  <p class="splash-title">현장 계측 입력</p>
  <div id="splashLoading" class="splash-bar" aria-hidden="true"><span></span></div>
  <div id="splashError" class="splash-error hidden">
    <p id="splashMessage"></p>
    <button id="retry" type="button" class="btn primary">다시 시도</button>
  </div>
</div>

<main id="gate" class="screen hidden">
  <h1 class="title">계측 입력</h1>
  <form id="gateForm" class="card">
    <label class="field"><span class="label">접속 코드</span>
      <input id="code" type="password" autocomplete="current-password">
    </label>
    <button type="submit" class="btn primary wide">확인</button>
  </form>
</main>

<main id="home" class="screen hidden">
  <header class="top">
    <select id="site" class="pill" aria-label="현장"></select>
    <select id="user" class="pill" aria-label="측정자"></select>
    <button id="manage" type="button" class="icon-btn gear" aria-label="현장·측정자 관리">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div class="row between">
    <h1 class="title">오늘의 계측</h1>
    <span id="today" class="muted"></span>
  </div>

  <a id="goInput" href="#input" class="tile">
    <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span>계측 입력</span>
  </a>

  <a id="goShot" href="#shot" class="tile alt">
    <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span>사진만 찍기</span>
  </a>

  <h2 class="section">내 최근 입력 5건</h2>
  <ul id="recentHome" class="list"></ul>
</main>

<form id="input" class="screen hidden" novalidate>
  <div class="bar-top">
    <a href="#home" class="icon-btn" aria-label="뒤로">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </a>
    <h1 class="title">계측 입력</h1>
  </div>

  <div id="types" class="chips" role="group" aria-label="계측기 종류"></div>

  <label id="instrumentField" class="field select-card">
    <span class="label">계측기 위치</span>
    <select id="instrument"></select>
  </label>
  <button id="addInstrument" type="button" class="btn outline small add-inst">＋ 계측기 추가</button>

  <label id="otherTypeField" class="field hidden"><span class="label">기타 종류 직접 입력</span>
    <input id="otherType" type="text" maxlength="100">
  </label>
  <label id="freeIdField" class="field hidden"><span class="label">계측기 ID</span>
    <input id="freeId" type="text" maxlength="100" autocapitalize="characters" autocomplete="off">
  </label>

  <div class="card">
    <label class="label" for="value">측정값</label>
    <div id="singleRow" class="value-row">
      <input id="value" type="number" step="any" inputmode="decimal" placeholder="0.0">
      <span id="unit" class="unit"></span>
    </div>
    <div id="multiRow" class="multi hidden">
      <label><span class="label">1</span><input id="mv0" type="number" step="any" inputmode="decimal" enterkeyhint="next" placeholder="0.0"><span class="unit"></span></label>
      <label><span class="label">2</span><input id="mv1" type="number" step="any" inputmode="decimal" enterkeyhint="next" placeholder="0.0"><span class="unit"></span></label>
      <label><span class="label">3</span><input id="mv2" type="number" step="any" inputmode="decimal" enterkeyhint="done" placeholder="0.0"><span class="unit"></span></label>
    </div>
    <div id="prev" class="muted"></div>
  </div>

  <label class="field"><span class="label">날짜</span>
    <input id="date" type="date">
  </label>
  <label class="field"><span class="label">특이사항 (선택)</span>
    <input id="memo" type="text" maxlength="1000" placeholder="예: 우천 후 측정">
  </label>
  <div class="field"><span class="label">사진 (선택, 여러 장 가능)</span>
    <div id="photoBoxEntry"></div>
  </div>

  <h2 class="section">내 최근 입력 5건</h2>
  <ul id="recentInput" class="list"></ul>

  <div class="bar-bottom">
    <div id="status" role="status"></div>
    <div class="row">
      <button id="draft" type="button" class="btn outline">임시저장</button>
      <button id="save" type="submit" class="btn primary grow">저장</button>
    </div>
  </div>
</form>

<form id="shot" class="screen hidden" novalidate>
  <div class="bar-top">
    <a href="#home" class="icon-btn" aria-label="뒤로">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </a>
    <h1 class="title">사진만 찍기</h1>
  </div>
  <p class="muted">계측값 없이 사진만 올립니다. 다른 현장이나 기타 사진도 됩니다.</p>

  <label class="field select-card"><span class="label">현장</span>
    <select id="shotSite"></select>
  </label>
  <div class="field"><span class="label">사진 (여러 장 가능)</span>
    <div id="photoBoxShot"></div>
  </div>
  <label class="field"><span class="label">메모 (선택)</span>
    <input id="shotMemo" type="text" maxlength="1000" placeholder="예: 가설울타리 균열">
  </label>

  <div class="bar-bottom">
    <div id="shotStatus" role="status"></div>
    <button id="shotSave" type="submit" class="btn primary wide">저장</button>
  </div>
</form>

<dialog id="manageDialog">
  <div class="dlg">
    <h2 class="dlg-title">현장·측정자 관리</h2>
    <p class="muted">삭제해도 이미 저장된 기록은 그대로 남습니다.</p>

    <h3 class="section">현장</h3>
    <ul id="siteList" class="list mlist"></ul>
    <form id="siteForm" class="row addrow" novalidate>
      <input id="siteNew" type="text" maxlength="100" placeholder="새 현장 이름" autocomplete="off">
      <button type="submit" class="btn primary small">추가</button>
    </form>

    <h3 class="section">측정자</h3>
    <ul id="userList" class="list mlist"></ul>
    <form id="userForm" class="row addrow" novalidate>
      <input id="userNew" type="text" maxlength="100" placeholder="새 측정자 이름" autocomplete="off">
      <button type="submit" class="btn primary small">추가</button>
    </form>

    <p id="manageError" class="dlg-err" role="alert"></p>
    <button id="manageClose" type="button" class="btn outline wide">닫기</button>
  </div>
</dialog>

<dialog id="instDialog">
  <form id="instForm" class="dlg" novalidate>
    <h2 class="dlg-title">계측기 추가</h2>
    <p id="instSite" class="muted"></p>
    <label class="field"><span class="label">계측기 ID</span>
      <input id="iId" type="text" maxlength="100" autocapitalize="characters" autocomplete="off">
    </label>
    <label class="field"><span class="label">종류 (목록에서 고르거나 새로 입력)</span>
      <input id="iType" type="text" maxlength="100" list="typeList" autocomplete="off">
      <datalist id="typeList"></datalist>
    </label>
    <label class="field"><span class="label">위치 (선택)</span>
      <input id="iPlace" type="text" maxlength="100" autocomplete="off">
    </label>
    <label class="field"><span class="label">단위 (선택)</span>
      <input id="iUnit" type="text" maxlength="100" placeholder="예: m, kN" autocomplete="off">
    </label>
    <p id="instError" class="dlg-err" role="alert"></p>
    <div class="row">
      <button id="instCancel" type="button" class="btn outline">취소</button>
      <button type="submit" class="btn primary grow">추가</button>
    </div>
  </form>
</dialog>

<script src="config.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
